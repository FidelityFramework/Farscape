[library]
name = "landingprobe"
headers = ["@HEADER@"]
include_paths = ["@INCLUDE@"]

[output]
mode = "fidelity"
directory = "@OUTPUT@"

[options]
c_header_mode = true
descriptor_only_dependencies = true
link_libraries = true

[annotations.nonnull]
nonnull_returns = ["landing_token", "landing_data"]
landing_read = [0]
landing_read_data = [0]
landing_invoke = [0, 1]
landing_invoke_void = [0, 1]

[[namespace]]
name = "@NAMESPACE@"
description = "Native entry ABI witness, Layer 2"
library = "landingprobe"
functions = ["landing_token", "landing_data", "landing_read", "landing_read_data", "landing_invoke", "landing_invoke_void", "landing_record"]
