name: Publish to NuGet

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for MinVer

      - uses: actions/checkout@v4
        with:
          repository: FidelityFramework/Fidelity.Data
          ref: v0.1.0
          path: ../Fidelity.Data

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

      - name: Pack library
        run: dotnet pack src/Farscape.Core/Farscape.Core.fsproj -c Release --no-build -o ./artifacts

      - name: Pack tool
        run: dotnet pack src/Farscape.Cli/Farscape.Cli.fsproj -c Release -o ./artifacts

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_TOKEN }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./artifacts/*.nupkg
